name: StormWand
version: '1.1.0'
main: com.stormwand.StormWand
api-version: '1.21'
description: A wand that unlocks stronger abilities as you get player kills.
commands:
  stormwand:
    description: Storm Wand commands
    usage: /stormwand <give [player]|kills [player]|reset [player]|setkills <player> <number>|reload>
    aliases: [swand]
permissions:
  stormwand.use:
    description: Allows using the Storm Wand
    default: true
  stormwand.give:
    description: Allows giving the Storm Wand
    default: op
  stormwand.reload:
    description: Allows reloading the config
    default: op
  stormwand.admin:
    description: Allows checking, resetting and setting other players' kills
    default: op
