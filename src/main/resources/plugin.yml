name: StormWand
version: 1.0.0
main: com.stormwand.StormWand
api-version: '1.21'
commands:
  stormwand:
    description: Give a Storm Wand or reload the plugin configuration.
    usage: /stormwand <give <player>|reload>
    aliases: [swand]
permissions:
  stormwand.use:
    description: Allows the player to use a Storm Wand.
    default: true
  stormwand.give:
    description: Allows the player to give Storm Wands.
    default: op
  stormwand.reload:
    description: Allows the player to reload StormWand configuration.
    default: op
